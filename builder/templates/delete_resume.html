{% extends "base.html" %}

{% block title %}
<title>Delete Resume</title>
{% endblock %}

{% block content %}

<h1>Delete Resume</h1>

<p>Are you sure you want to delete "{{ resume.display_name }}"?</p>

<form method="POST">
    {% csrf_token %}

    <button type="submit">Delete Resume</button>
</form>

<a href="{% url 'manage_resumes' %}">Cancel</a>

{% endblock %}
