{% extends "base.html" %}

{% block title %}
<title>Login</title>
{% endblock %}

{% block content %}
<main class="auth-page">
    <header class="auth-header">
        <h1>Welcome Back</h1>
        <p>Log in to manage your personal website.</p>
    </header>

    <section class="auth-card">
        <form method="POST" class="dashboard-form">
            {% csrf_token %}
            {{ form.as_p }}

            <button class="primary-button" type="submit">
                Log In
            </button>
        </form>
    </section>
</main>
{% endblock %}
