{% extends "base.html" %}

{% block title %}
    <title>About Me | {{ profile.display_name }}</title>
{% endblock %}

{% block content %}
    <h1>{{ profile.display_name }}</h1>
    {% if profile.profile_image %}
        <img src="{{ profile.profile_image.url }}">
    {% endif %}
    <h2>{{ profile.email }}</h2>
    <p>{{ profile.bio }}</p>
{% endblock %}
