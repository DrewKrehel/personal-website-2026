{% extends "base.html" %}

{% block title %}
<title>Edit Project</title>
{% endblock %}

{% block content %}
<main class="dashboard-page">
    <a class="back-link" href="{% url 'manage_projects' %}">
        &larr; Back to Projects
    </a>

    <header class="dashboard-header">
        <h1>Edit Project</h1>
        <p>Update your project details and portfolio image.</p>
    </header>

    <section class="dashboard-panel">
        <form method="POST" enctype="multipart/form-data" class="dashboard-form">
            {% csrf_token %}
            {{ form.as_p }}

            <div class="confirmation-actions">
                <button class="primary-button" type="submit">
                    Save Project
                </button>

                <a class="button-link" href="{% url 'manage_projects' %}">
                    Cancel
                </a>
            </div>
        </form>
    </section>
</main>
{% endblock %}
