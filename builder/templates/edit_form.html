{% extends "base.html" %}

{% block title %}
<title>Edit Form</title>
{% endblock %}

{% block content %}
<main class="dashboard-page">
    <a class="back-link" href="{% url 'manage_forms' %}">
        &larr; Back to Forms
    </a>

    <header class="dashboard-header">
        <h1>Edit Form</h1>
        <p>Update your form's questions, fields, and response settings.</p>
    </header>

    <section class="dashboard-panel">
        <form method="POST" class="dashboard-form">
            {% csrf_token %}
            {{ form.as_p }}

            <div class="confirmation-actions">
                <button class="primary-button" type="submit">
                    Save Form
                </button>

                <a class="button-link" href="{% url 'manage_forms' %}">
                    Cancel
                </a>
            </div>
        </form>
    </section>
</main>
{% endblock %}
