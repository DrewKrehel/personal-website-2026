{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    {% block title %}
    <title>Personal Website</title>
    {% endblock %}

    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>

<body>
    {% if profile %}
    <nav>
        <ul>
            <li> <a href="{% url 'about' username=profile.user.username %}">About Me</a></li>
            <li> <a href="{% url 'projects' username=profile.user.username %}">Projects</a></li>
            <li> <a href="{% url 'resumes' username=profile.user.username %}">Resumes</a></li>
            <li> <a href="{% url 'links' username=profile.user.username %}">Links</a></li>
            <li> <a href="{% url 'forms' username=profile.user.username %}">Forms</a></li>
        </ul>
    </nav>
    {% endif %}

    {% block content %}

    {% endblock %}
</body>

</html>
